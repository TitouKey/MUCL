{% extends "admin/base.html" %}

{% block title %}{% if crew %}Edit Crew{% else %}Add Crew{% endif %}{% endblock %}

{% block admin_content %}

<div class="admin-card">
  <div class="admin-card-header">
    <h2 class="admin-card-title">{% if crew %}Edit Crew{% else %}Add Crew{% endif %}</h2>
    <a href="{{ url_for('admin_crews') }}" class="btn btn-secondary">Back to Crews</a>
  </div>
  
  <form method="POST" enctype="multipart/form-data">
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem;">
      <div>
        <div class="form-group">
          <label for="name">Name *</label>
          <input type="text" id="name" name="name" value="{{ crew.name if crew else '' }}" required placeholder="Crew name">
        </div>
        
        <div class="form-group">
          <label for="slug">Slug *</label>
          <input type="text" id="slug" name="slug" value="{{ crew.slug if crew else '' }}" required placeholder="crew-slug">
          <small style="color: #999;">Used in URLs, must be unique</small>
        </div>
        
        <div class="form-group">
          <label for="year">Year</label>
          <input type="text" id="year" name="year" value="{{ crew.year if crew else '' }}" placeholder="2024-2025">
        </div>
        
        <div class="form-group">
          <label for="order_index">Order Index</label>
          <input type="number" id="order_index" name="order_index" value="{{ crew.order_index if crew else 0 }}" placeholder="0">
          <small style="color: #999;">Higher numbers appear first</small>
        </div>
      </div>
      
      <div>
        <div class="form-group">
          <label for="tagline">Tagline (EN)</label>
          <input type="text" id="tagline" name="tagline" value="{{ crew.tagline if crew else '' }}" placeholder="Short description">
        </div>
        
        <div class="form-group">
          <label for="tagline_fr">Tagline (FR)</label>
          <input type="text" id="tagline_fr" name="tagline_fr" value="{{ crew.tagline_fr if crew else '' }}" placeholder="Description courte">
        </div>
        
        <div class="form-group">
          <label for="is_current">
            <div class="form-check">
              <input type="checkbox" id="is_current" name="is_current" {% if crew and crew.is_current %}checked{% endif %}>
              <label for="is_current">Is Current Crew</label>
            </div>
          </label>
        </div>
      </div>
    </div>
    
    <div class="form-group">
      <label for="description">Description (EN)</label>
      <textarea id="description" name="description" placeholder="Detailed description...">{{ crew.description if crew else '' }}</textarea>
    </div>
    
    <div class="form-group">
      <label for="description_fr">Description (FR)</label>
      <textarea id="description_fr" name="description_fr" placeholder="Description détaillée...">{{ crew.description_fr if crew else '' }}</textarea>
    </div>
    
    <div class="form-group" style="margin-top: 2rem;">
      <button type="submit" class="btn btn-primary">
        {% if crew %}Update Crew{% else %}Create Crew{% endif %}
      </button>
      <a href="{{ url_for('admin_crews') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
